name: build

# Every push (any branch, and any tag you create by hand) plus every pull request.
# This workflow only builds: tags and releases stay manual.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.1.0 (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag || 'none' }}
  cancel-in-progress: true

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest already ships the Android SDK and a matching cmdline-tools, so no
      # marketplace action is used here: setup-android@v3 still tries to install the "tools"
      # package, which the SDK repository no longer publishes. Only the licences are refreshed,
      # the missing platform / build-tools / NDK / CMake are then pulled by AGP itself.
      - name: Accept SDK licences
        run: |
          set -uo pipefail
          manager=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "${manager:-}" ]; then
            yes | "$manager" --licenses > /dev/null || true
            echo "licences accepted via $manager"
          else
            echo "sdkmanager not found; leaving the runner image licences untouched"
          fi

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Git on Windows stores gradlew without the executable bit.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Assemble
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      # A renamed package or a renamed JNI class breaks the probe silently at runtime,
      # so the entry points are checked against the packaged library, not the sources.
      - name: Verify native entry points
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          unzip -p "$apk" lib/arm64-v8a/libphantom_probe.so > /tmp/libphantom_probe.so
          prefix="Java_me_kanadex_phantomprobe_probe_PhantomProcessNative_"
          for entry in forkNullLoop waitPidNoHang killPid reapPid; do
            strings /tmp/libphantom_probe.so | grep -q "$prefix$entry"
            echo "ok: $entry"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phantom-probe-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 只有手动触发且填了 tag 才发版；APK 用本 job 刚构建出来的文件，不经过本地。
      # Release body 来自 docs/releases/<tag>.md：正文与流程分离，缺文件直接失败，不发空壳 release。
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "missing $notes: every tag needs a release note, refusing to publish an empty release." >&2
            exit 1
          fi
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          cp "$apk" "PhantomProbe-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes"
            gh release upload "$TAG" "PhantomProbe-$TAG.apk" --clobber
          else
            gh release create "$TAG" "PhantomProbe-$TAG.apk" \
              --target "$GITHUB_SHA" \
              --title "PhantomProbe ${TAG#v}" \
              --notes-file "$notes"
          fi